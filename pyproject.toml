[project]
name = "BuildingTools"
version = "1.0.13"
description = "Crazy fast way to model buildings in Blender"
authors = [
    {name = "ranjian0", email = "karanjaichungwa@gmail.com"},
]
dependencies = [
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[dependency-groups]
lint = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "ruff>=0.16.6",
    "fake-bpy-module-latest>=20260909",
]
dev = [
    "numpy>=2.5.3",
]

[tool.uv]
package = false
default-groups = ["lint", "dev"]
