[project]
name = "BuildingTools"
version = "1.0.13"
description = "Crazy fast way to model buildings in Blender"
authors = [
    {name = "ranjian0", email = "karanjaichungwa@gmail.com"},
]
dependencies = [
]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "MIT"

[dependency-groups]
lint = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
    "fake-bpy-module-latest>=20260909",
    "bpy==5.1.2",
    "pillow>=12.3.0",
]
dev = [
    "numpy>=2.5.3",
]

[tool.uv]
package = false
default-groups = ["lint", "dev"]

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "btools.*"
# Blender's declarative property pattern uses function calls as annotations:
#   foo: FloatProperty(...)
disable_error_code = ["valid-type"]

[tool.ruff.lint]
ignore = [
    # Blender's declarative property pattern: mutable class attrs and
    # function calls as defaults are how bpy PropertyGroups are defined
    "RUF012",
    "RUF009",
    "B008",
    # Legacy style in stable geometry code -- adopt incrementally
    "UP031",  # printf-string-formatting
    "UP028",  # yield-in-for-loop -> yield from
    "SIM101", # duplicate-isinstance-call
    "SIM102", # collapsible-if
    "SIM117", # multiple-with-statements
    "SIM118", # in-dict-keys
    "C401",   # unnecessary-generator-set
    "C408",   # unnecessary-collection-call
    "C417",   # unnecessary-map
    "C419",   # unnecessary-comprehension-in-call
    # These rewrites can change behavior in this codebase
    "RUF015", # next(iter()) raises StopIteration where list()[0] raises IndexError
    "SIM201", # != rewrite is not equivalent for numpy array comparisons
    "RUF017", # quadratic summation rewrite over bmesh sequences
    "FURB192",# sorted()[0] -> min() rewrites
    # Intentional patterns
    "PLR1704",# redefined-argument-from-local: renaming needs API decisions
    "TRY002", # vanilla exceptions are the addon's error style
    "BLE001", # blind except at Blender operator boundaries
]

[tool.ruff.lint.per-file-ignores]
# legacy test harness: dynamic exec + loose unpacks are intentional
"tests/tools.py" = ["SIM115", "RUF059", "S102", "F401"]

